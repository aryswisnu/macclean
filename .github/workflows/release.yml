name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: UNIVERSAL=1 VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Verify universal binary
        run: lipo -archs MacClean.app/Contents/MacOS/MacClean | tr ' ' '\n' | sort | tr '\n' ' '

      - name: Package
        run: ditto -c -k --keepParent MacClean.app MacClean.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" MacClean.zip --title "${GITHUB_REF_NAME}" --generate-notes
